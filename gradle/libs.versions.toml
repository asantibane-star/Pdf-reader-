# Últimas versiones estables resueltas el 2026-11-16 desde Google Maven / Maven Central.
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.14"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
lifecycle = "2.11.0"
room = "2.8.5"
