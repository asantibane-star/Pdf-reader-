name: CI

on:
  push:
  pull_request:

# Permisos mínimos por defecto (PLAN §12).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Validar el wrapper de Gradle
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar plataforma Android 37 y build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Lint, pruebas unitarias y APK de depuración
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: APK de release (firmado si hay secrets; si no, con la clave de depuración)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            suffix=""
          else
            suffix="-unsigned-debugkey"
          fi
          ./gradlew assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/lector-release${suffix}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk dist/lector-debug.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Verificar el APK (sin permisos, no debuggable, una sola Activity exportada)
        run: |
          ./scripts/check-apk.sh app/build/outputs/apk/release/app-release.apk
          ./scripts/check-apk.sh app/build/outputs/apk/debug/app-debug.apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: lector-apk
          path: dist/*.apk
          if-no-files-found: error
